          import copy, json, unittest
          from pathlib import Path
          from run import publication, validate

          class PublicationTests(unittest.TestCase):
              def setUp(self):
                  self.old=json.loads(Path('seed.json').read_text())
                  self.entry=copy.deepcopy(next(e for e in self.old['exhibitions'] if e['museumId']=='kyohaku'))
                  self.entry['end']='2026-11-30'
                  self.entry['verifiedAt']='2026-09-03'
              def test_preview_keeps_entire_feed_unchanged(self):
                  self.assertEqual(publication(self.old,{'kyohaku':[self.entry]},set(),'2026-09-03'),self.old)
              def test_all_failed_preserves_updated_at(self):
                  self.assertEqual(publication(self.old,{'kyohaku':[]},{'kyohaku'},'2026-09-03'),self.old)
              def test_only_enabled_source_changes(self):
                  out=publication(self.old,{'kyohaku':[self.entry]},{'kyohaku'},'2026-09-03')
                  self.assertEqual(next(e for e in out['exhibitions'] if e['id']==self.entry['id'])['end'],'2026-11-30')
                  self.assertEqual([e for e in out['exhibitions'] if e['museumId']=='minpaku'],[e for e in self.old['exhibitions'] if e['museumId']=='minpaku'])
                  self.assertEqual(len(out['exhibitions']),len(self.old['exhibitions']))
              def test_rejects_invalid_date(self):
                  self.entry['end']='2026-01-01'
                  with self.assertRaises(ValueError):publication(self.old,{'kyohaku':[self.entry]},{'kyohaku'},'2026-09-03')
              def test_rejects_unexpected_museum(self):
                  with self.assertRaises(ValueError):publication(self.old,{'shiga':[self.entry]},{'shiga'},'2026-09-03')
              def test_rejects_http(self):
                  self.entry['url']='http://example.com'
                  with self.assertRaises(ValueError):publication(self.old,{'kyohaku':[self.entry]},{'kyohaku'},'2026-09-03')
              def test_rejects_mass_addition(self):
                  with self.assertRaises(ValueError):publication(self.old,{'kyohaku':[self.entry]*51},{'kyohaku'},'2026-09-03')
              def test_seed_is_valid(self):validate(self.old)
          class ReviewedReportTests(unittest.TestCase):
              def setUp(self):
                  self.seed=json.loads(Path('seed.json').read_text())
                  self.report=json.loads(Path('reviewed-report.json').read_text())
                  self.results={r['museumId']:r['entries'] for r in self.report}
              def test_reviewed_report_has_no_legacy_duplicates(self):
                  out=publication(self.seed,self.results,set(self.results),'2026-09-02')
                  self.assertEqual(len(out['exhibitions']),46)
                  self.assertTrue({e['id'] for e in self.seed['exhibitions']} <= {e['id'] for e in out['exhibitions']})
                  self.assertEqual([e for e in out['exhibitions'] if e['museumId']=='minpaku'],[e for e in self.seed['exhibitions'] if e['museumId']=='minpaku'])
                  again=publication(out,self.results,set(self.results),'2026-09-03')
                  self.assertEqual(len(again['exhibitions']),46)
              def test_titles_exclude_location_labels(self):
                  out=publication(self.seed,self.results,set(self.results),'2026-09-02')
                  for e in out['exhibitions']:
                      self.assertNotIn('\u4f1a\u5834[',e['title'])
                      self.assertNotIn('\u968e\u5c55\u793a\u5ba4',e['title'])
              def test_future_title_change_matches_exact_event_url(self):
                  out=publication(self.seed,self.results,set(self.results),'2026-09-02')
                  e=copy.deepcopy(self.results['kyocera'][0]);e['title']='\u65b0\u3057\u3044\u6b63\u5f0f\u540d\u79f0';e['id']='new-title-id'
                  again=publication(out,{'kyocera':[e]},{'kyocera'},'2026-09-03')
                  self.assertEqual(len(again['exhibitions']),len(out['exhibitions']))
              def test_multipart_same_url_stays_separate(self):
                  out=publication(self.seed,self.results,{'kyohaku'},'2026-09-02')
                  parts=[e for e in out['exhibitions'] if '/2027_kano/' in e['url']]
                  self.assertEqual(len(parts),2)
                  self.assertNotEqual(parts[0]['start'],parts[1]['start'])

          if __name__=='__main__':unittest.main()
