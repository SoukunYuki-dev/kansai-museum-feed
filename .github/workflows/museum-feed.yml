name: Museum feed
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/museum-feed.yml', 'scripts/**', 'config/**', 'certs/**', 'tests/**']
permissions:
  contents: write
concurrency:
  group: museum-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Collect official exhibition pages
        run: python3 scripts/update_feed.py
      - name: Publish meaningful changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- exhibitions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update museum exhibition feed'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Save collection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: museum-collection-report
          path: report/
          retention-days: 7
          if-no-files-found: warn

