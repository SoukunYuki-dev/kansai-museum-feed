name: Museum feed
on:
  push:
    branches: [main]
    paths: ['.github/workflows/museum-feed.yml']
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: museum-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Six adapters reviewed against the initial GitHub collection report.
      AUTO_PUBLISH_MUSEUMS: kyohaku,kyocera,nakka,osakaart,bunpaku,shiga
    steps:
      - uses: actions/checkout@v4
      - name: Prepare self-contained collector
        shell: bash
        run: |
          mkdir -p _museum
          cat > _museum/collector.py <<'MUSEUM_FILE_END'
          """Conservative official-site extraction. Writes a review candidate, never edits input.
          Run: python -m collector.collect --input app/src/main/assets/exhibitions.json --output build/candidate.json
          Live adapters require review against current HTML before enabling automated publication.
          """
          from html.parser import HTMLParser
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urljoin, urlsplit
          from pathlib import Path
          import argparse, copy, hashlib, json, re, time, unicodedata

          # Only explicit years establish a date range. Never guess the year from today's date.
          DATE = r'(?:(?P<{p}y>20\d{{2}})\s*[\u5e74./-]\s*)?(?P<{p}m>\d{{1,2}})\s*[\u6708./-]\s*(?P<{p}d>\d{{1,2}})\s*\u65e5?'
          RANGE = re.compile(DATE.format(p='a') + r'\s*(?:\([^)]*\))?\s*(?:[A-Za-z]{3}\.?\s*)?[\uff5e\u301c~\u2013\u2014\uff0d-]\s*' + DATE.format(p='b'))

          def date_ranges(text):
              text=unicodedata.normalize('NFKC', text)
              result=[]
              for m in RANGE.finditer(text):
                  if not m['ay']:continue
                  try:
                      start=date(int(m['ay']),int(m['am']),int(m['ad']))
                      end_year=int(m['by']) if m['by'] else start.year+(int(m['bm'])<start.month)
                      end=date(end_year,int(m['bm']),int(m['bd']))
                      if start<=end and (end-start).days<730:result.append((start.isoformat(),end.isoformat()))
                  except ValueError:pass
              return result

          class Node:
              def __init__(self,tag='',attrs=None,parent=None):
                  self.tag=tag;self.attrs=dict(attrs or []);self.parent=parent;self.children=[]
              def text(self):
                  return ' '.join(c if isinstance(c,str) else c.text() for c in self.children if isinstance(c,str) or c.tag not in ('script','style','nav','header','footer'))
              def walk(self):
                  yield self
                  for c in self.children:
                      if isinstance(c,Node):yield from c.walk()

          class Tree(HTMLParser):
              VOID={'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}
              def __init__(self,html):
                  super().__init__(convert_charrefs=True);self.root=Node('root');self.current=self.root;self.feed(html)
              def handle_starttag(self,tag,attrs):
                  n=Node(tag,attrs,self.current);self.current.children.append(n)
                  if tag not in self.VOID:self.current=n
              def handle_startendtag(self,tag,attrs):
                  self.handle_starttag(tag,attrs)
                  if tag not in self.VOID:self.handle_endtag(tag)
              def handle_endtag(self,tag):
                  n=self.current
                  while n.parent:
                      if n.tag==tag:self.current=n.parent;break
                      n=n.parent
              def handle_data(self,text):self.current.children.append(text)

          def extract(html,config,checked):
              tree=Tree(html);out={};origin=urlsplit(config['url'])
              for a in tree.root.walk():
                  if a.tag!='a':continue
                  url=urljoin(config['url'],a.attrs.get('href',''))
                  parsed=urlsplit(url)
                  if parsed.scheme!='https' or parsed.netloc!=origin.netloc or not re.search(config['path'],parsed.path):continue
                  node=a;block=None
                  for _ in range(4):
                      if node is None or node.tag in ('body','html','root','main'):break
                      t=' '.join(node.text().split());ranges=date_ranges(t)
                      if len(ranges)>1:break
                      if len(ranges)==1 and len(t)<650:
                          # Do not assign one sibling exhibition's date to another link.
                          links={n.attrs.get('href') for n in node.walk() if n.tag=='a' and re.search(config['path'],urlsplit(urljoin(config['url'],n.attrs.get('href',''))).path)}
                          if len(links)<=1:block=(node,t,ranges[0])
                          break
                      node=node.parent
                  if not block:continue
                  node,t,(start,end)=block
                  if config.get('require') and not re.search(config['require'],t):continue
                  if re.search(r'\u30b3\u30ec\u30af\u30b7\u30e7\u30f3|\u5e38\u8a2d\u5c55|\u540d\u54c1\u30ae\u30e3\u30e9\u30ea\u30fc|\u8b1b\u6f14\u4f1a|\u30ef\u30fc\u30af\u30b7\u30e7\u30c3\u30d7|\u516c\u52df\u5c55',t):continue
                  titles=[n.text() for n in node.walk() if n.tag in ('h2','h3','h4')]
                  title=' '.join(titles) if titles else a.text()
                  title=RANGE.sub('',unicodedata.normalize('NFKC',title))
                  title=re.sub(r'\u958b\u50ac\u4e2d|\u958b\u50ac\u4e88\u5b9a|\u7d42\u4e86\u307e\u3067\d+\u65e5|\u30c1\u30b1\u30c3\u30c8\u8cfc\u5165|\([^)]*\)\s*$','',title)
                  title=' '.join(title.split()).strip(' \u00b7|-')
                  if len(title)<3 or title in ('\u8a73\u7d30\u3092\u898b\u308b','Read More'):continue
                  key=hashlib.sha256(f"{config['id']}|{title}|{start}".encode()).hexdigest()[:16]
                  out[key]=dict(id=key,museumId=config['id'],title=title,start=start,end=end,url=url,verifiedAt=checked)
              return list(out.values())

          def title_key(e):
              return re.sub(r'\s+','',unicodedata.normalize('NFKC',e['title'])).removeprefix('\u7279\u5225\u5c55')

          # One-time ID migration: these exact report entries were reviewed against the seed.
          LEGACY_IDS = {'0507be3857aaf784': 'f317fdcac0c2d571', '3de57139fcc39d78': 'a36e257e2a750b71', '62902e60b8845143': '894d62a6dc68f305', '137d73fe3d195ac1': 'e35365db6b1deb1f', '608160a54230f0cb': 'a39ac0af10e95713', '9dfc74346c9bdaa0': 'ea9da9675bc35563', 'a649ba0f5eac4c7d': 'e26b95490c790430', 'ef420067f429247e': '78395bc937b7cc7e', '25126c2509470144': 'dea61e9d78ee46cb', 'b5a52cdcdf11cdae': '6bdcc685244c95fa'}

          def clean_title(title, mid):
              title=unicodedata.normalize('NFKC', title)
              if mid=='kyocera':
                  title=re.sub(r'\s+\u4f1a\u5834\[.*\]\s*$', '', title)
              if mid=='bunpaku':
                  title=re.sub(r'\s+\([\u6708\u706b\u6c34\u6728\u91d1\u571f\u65e5\u30fb\u795d\u4f11]+\)\s+[0-9\u30fb]+\u968e\u5c55\u793a\u5ba4\s*$', '', title)
              if mid=='osakaart':
                  title=re.sub(r'\s+\u7279\u5225\u5c55\s*$', '', title)
              return ' '.join(title.split())

          def merge(previous,results,checked):
              out=copy.deepcopy(previous);out['updatedAt']=checked
              for museum in out['museums']:
                  mid=museum['id']
                  if mid not in results:continue
                  entries=results[mid]
                  museum['state']='ok' if entries else 'error'
                  for raw in entries:
                      e=copy.deepcopy(raw);e['title']=clean_title(e['title'],mid)
                      stable_id=LEGACY_IDS.get(e['id'],e['id'])
                      same_museum=[old for old in out['exhibitions'] if old['museumId']==mid]
                      matches=[old for old in same_museum if old['id']==stable_id]
                      if not matches:
                          # Exact date distinguishes multipart exhibitions sharing a detail URL.
                          matches=[old for old in same_museum if old['url']==e['url'] and old['start']==e['start']]
                      if not matches:
                          matches=[old for old in same_museum if title_key(old)==title_key(e) and abs((date.fromisoformat(old['start'])-date.fromisoformat(e['start'])).days)<180]
                      if len(matches)>1:raise ValueError('ambiguous exhibition identity')
                      if matches:
                          old=matches[0];stable=old['id'];old.update(e);old['id']=stable
                      else:out['exhibitions'].append(e)
              return out

          class SameHostRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  new=urljoin(req.full_url,newurl)
                  if urlsplit(new).scheme!='https' or urlsplit(new).netloc!=urlsplit(req.full_url).netloc:
                      raise ValueError('redirect outside configured official host')
                  return super().redirect_request(req,fp,code,msg,headers,new)

          def fetch(url):
              if urlsplit(url).scheme!='https':raise ValueError('HTTPS required')
              request=Request(url,headers={'User-Agent':'MuseumTecho/0.1 (+personal exhibition index)','Accept':'text/html'})
              with build_opener(SameHostRedirect()).open(request,timeout=20) as r:
                  raw=r.read(2*1024*1024+1)
                  if len(raw)>2*1024*1024:raise ValueError('page too large')
                  encoding=r.headers.get_content_charset() or 'utf-8'
                  return raw.decode(encoding)

          def main():
              p=argparse.ArgumentParser();p.add_argument('--input',required=True);p.add_argument('--output',required=True);p.add_argument('--fixtures',help='Offline HTML directory: museum-id.html');args=p.parse_args()
              if Path(args.input).resolve()==Path(args.output).resolve():p.error('output must differ from input')
              previous=json.loads(Path(args.input).read_text(encoding='utf-8'))
              configs=json.loads(Path(__file__).with_name('sources.json').read_text(encoding='utf-8'))
              checked=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat();results={};report=[]
              for config in configs:
                  mid=config['id']
                  try:
                      html=Path(args.fixtures,mid+'.html').read_text(encoding='utf-8') if args.fixtures else fetch(config['url'])
                      entries=extract(html,config,checked);results[mid]=entries
                      report.append(dict(museumId=mid,status='candidate' if entries else 'needs_review',count=len(entries)))
                  except Exception as e:
                      results[mid]=[];report.append(dict(museumId=mid,status='error',error=type(e).__name__))
                  if not args.fixtures:time.sleep(1)
              candidate=merge(previous,results,checked);candidate['collectionReport']=report
              dest=Path(args.output);dest.parent.mkdir(parents=True,exist_ok=True)
              temp=dest.with_suffix('.tmp');temp.write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');temp.replace(dest)
              print(json.dumps(report,ensure_ascii=False))
              return 0 if any(results.values()) else 1
          if __name__=='__main__':raise SystemExit(main())
          MUSEUM_FILE_END
          cat > _museum/run.py <<'MUSEUM_FILE_END'
          """Collect candidates; publish only explicitly reviewed adapters. No third-party packages."""
          import copy
          import json
          import os
          from datetime import datetime, date
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from urllib.parse import urlsplit
          from collector import fetch, extract, merge

          MAX_BYTES = 2 * 1024 * 1024

          def validate(feed):
              if feed.get('schemaVersion') != 1:
                  raise ValueError('unsupported schema')
              date.fromisoformat(feed['updatedAt'])
              museums = feed['museums']
              entries = feed['exhibitions']
              if not 1 <= len(museums) <= 300 or not 1 <= len(entries) <= 3000:
                  raise ValueError('invalid feed size')
              ids = [m['id'] for m in museums]
              if len(ids) != len(set(ids)):
                  raise ValueError('duplicate museum')
              seen = set()
              for e in entries:
                  if e['id'] in seen or e['museumId'] not in ids:
                      raise ValueError('invalid exhibition identity')
                  seen.add(e['id'])
                  if not isinstance(e['title'], str) or not e['title'].strip():
                      raise ValueError('missing title')
                  a, b = date.fromisoformat(e['start']), date.fromisoformat(e['end'])
                  if a > b or (b-a).days >= 730:
                      raise ValueError('invalid date range')
              for row in museums + entries:
                  u = urlsplit(row['url'])
                  if u.scheme != 'https' or not u.hostname or u.username or u.password:
                      raise ValueError('invalid official URL')
              if len(json.dumps(feed, ensure_ascii=False).encode()) > MAX_BYTES:
                  raise ValueError('feed too large')

          def publication(previous, results, approved, checked):
              """Failed/unapproved museums retain exact previous entries and verification dates."""
              validate(previous)
              good = {mid: entries for mid, entries in results.items() if mid in approved and entries}
              if not good:
                  return copy.deepcopy(previous)
              for mid, entries in good.items():
                  if len(entries) > 50 or any(e['museumId'] != mid for e in entries):
                      raise ValueError('suspicious source result')
              output = merge(previous, good, checked)
              validate(output)
              if not {e['id'] for e in previous['exhibitions']} <= {e['id'] for e in output['exhibitions']}:
                  raise ValueError('existing exhibition removed')
              return output

          def save_json(path, value):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              temp = path.with_suffix('.tmp')
              temp.write_text(json.dumps(value, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              temp.replace(path)

          def main():
              configs = json.loads(Path('sources.json').read_text())
              approved = {s.strip() for s in os.environ.get('AUTO_PUBLISH_MUSEUMS', '').split(',') if s.strip()}
              if approved - {c['id'] for c in configs}:
                  raise ValueError('unknown AUTO_PUBLISH_MUSEUMS id')
              previous = json.loads(Path('exhibitions.json').read_text())
              validate(previous)
              checked = datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
              results, report = {}, []
              import time
              for config in configs:
                  mid = config['id']
                  try:
                      entries = extract(fetch(config['url']), config, checked)
                      # Do not add historical exhibitions to a current/upcoming index.
                      entries = [e for e in entries if e['end'] >= checked]
                      results[mid] = entries
                      report.append({'museumId': mid, 'officialUrl': config['url'],
                                     'status': 'obtained' if entries else 'needs_review',
                                     'autoPublish': mid in approved, 'count': len(entries), 'entries': entries})
                  except Exception as error:
                      results[mid] = []
                      report.append({'museumId': mid, 'status': 'error', 'error': type(error).__name__,
                                     'autoPublish': mid in approved, 'count': 0})
                  time.sleep(1)
              save_json('report/collection-report.json', report)
              summary = ['## Museum feed collection', '', 'Preview entries are not published unless their adapter is enabled.', '',
                         '| Museum | Result | Count | Auto publish |', '|---|---|---:|---|']
              for row in report:
                  summary.append('| {museumId} | {status} | {count} | {autoPublish} |'.format(**row))
              summary += ['', 'Other museums, including Minpaku, keep their saved data.',
                          'See the collection-report artifact for exact titles, dates and official links.']
              Path('report/summary.md').write_text('\n'.join(summary)+'\n')
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                      f.write('\n'.join(summary)+'\n')
              output = publication(previous, results, approved, checked)
              if output != previous:
                  save_json('exhibitions.json', output)
              if not any(results.values()):
                  raise RuntimeError('No source could be extracted. Existing feed retained.')
              if approved and not any(results.get(mid) for mid in approved):
                  raise RuntimeError('All enabled sources failed. Existing feed retained.')

          if __name__ == '__main__':
              main()
          MUSEUM_FILE_END
          cat > _museum/sources.json <<'MUSEUM_FILE_END'
          [
           {"id":"kyohaku","url":"https://www.kyohaku.go.jp/jp/exhibitions/","path":"/jp/exhibitions/special/","require":"\u7279\u5225\u5c55"},
