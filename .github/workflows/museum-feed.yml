      - name: Test preservation and validation
        working-directory: _museum
        run: python3 -m unittest -v test_run.py
      - name: Initialize saved exhibition feed
        shell: bash
        run: |
          if [ ! -f exhibitions.json ]; then
            cp _museum/seed.json exhibitions.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- exhibitions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update museum exhibition feed'
            git push origin HEAD:main
          fi
      - name: Collect official exhibition pages
        shell: bash
        run: |
          cp exhibitions.json _museum/exhibitions.json
          cd _museum
          python3 run.py
          cp exhibitions.json ../exhibitions.json
      - name: Publish reviewed updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- exhibitions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update museum exhibition feed'
            git push origin HEAD:main
          fi
      - name: Save collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: museum-collection-report
          path: _museum/report/
          retention-days: 7
          if-no-files-found: warn
