           {"id":"nakka","url":"https://nakka-art.jp/exhibition/held/","path":"/exhibition-post/"},
           {"id":"osakaart","url":"https://www.osaka-art-museum.jp/","path":"/special_exhibition/"},
           {"id":"bunpaku","url":"https://www.bunpaku.or.jp/","path":"/exhi_special_post/"},
           {"id":"shiga","url":"https://www.shigamuseum.jp/exhibitions/","path":"/exhibitions/[^/]+"}
          ]
          MUSEUM_FILE_END
