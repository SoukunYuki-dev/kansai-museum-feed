name: Minpaku TLS diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve official host
        run: getent ahosts www.minpaku.ac.jp

      - name: Inspect certificate chain
        continue-on-error: true
        run: |
          set +e
          openssl s_client \
            -connect www.minpaku.ac.jp:443 \
            -servername www.minpaku.ac.jp \
            -showcerts \
            -verify_return_error \
            </dev/null 2>&1 | tee /tmp/minpaku-tls.txt
          echo "openssl_exit=${PIPESTATUS[0]}"

      - name: Inspect leaf certificate
        continue-on-error: true
        run: |
          awk '/BEGIN CERTIFICATE/{found=1} found{print} /END CERTIFICATE/{exit}' \
            /tmp/minpaku-tls.txt > /tmp/minpaku-leaf.pem
          openssl x509 -in /tmp/minpaku-leaf.pem -noout \
            -subject -issuer -serial -dates -fingerprint -sha256 \
            -ext subjectAltName -ext authorityInfoAccess

      - name: Test verified clients
        continue-on-error: true
        run: |
          set +e
          curl --fail --show-error --head --max-time 30 \
            https://www.minpaku.ac.jp/
          echo "curl_exit=$?"
          python3 - <<'PY'
          from urllib.request import urlopen
          with urlopen("https://www.minpaku.ac.jp/", timeout=30) as response:
              print(response.status, response.url)
          PY
          echo "python_exit=$?"
